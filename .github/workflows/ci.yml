name: CI

# Runs on push / PR. google-services.json is git-ignored: the debug-APK job uses
# the real file from the GOOGLE_SERVICES_JSON_B64 secret when it is set, otherwise
# a placeholder (.github/ci/google-services.placeholder.json) — enough to compile,
# never shipped. (The job used to be gated on HAS_FIREBASE_SECRET, never set, so
# it was always skipped and nothing compiled the APK.)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Host unit tests (commonMain + androidMain)
        run: ./gradlew :composeApp:testAndroidHostTest --no-configuration-cache

  build-debug-apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > androidApp/google-services.json
          else
            cp .github/ci/google-services.placeholder.json androidApp/google-services.json
          fi
      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --no-configuration-cache
