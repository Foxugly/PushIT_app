name: Dependency submission

# Le graphe de dependances de GitHub ne sait pas resoudre un projet Gradle
# tout seul. Sans soumission explicite, le SBOM de ce depot ne contenait que
# les actions de workflow (actions/checkout, setup-java, setup-gradle) et
# AUCUNE dependance Kotlin/Android -- donc aucune alerte Dependabot possible
# sur l'arbre reel. Constate le 2026-07-30 : 4 paquets au SBOM cote
# PushIT_app, 2 cote trainingmanager_app, alors que gradle/libs.versions.toml
# en declare des dizaines.
#
# Le bloc `gradle` de .github/dependabot.yml couvre les PR de mise a jour,
# mais PAS les alertes de securite : celles-ci dependent du graphe, qu'il
# faut alimenter ici.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # requis pour soumettre l'instantane du graphe

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # Ne soumettre QUE ce qui est reellement livre.
      #
      # Sans ce filtre, l'action soumet TOUTES les configurations resolues, y
      # compris `unified-test-platform-*` (le runner de tests instrumentes
      # d'AGP), `androidLintTool` et le classpath de build. Resultat le
      # 2026-07-30 : 45 alertes Dependabot sur ce depot, dont une critique,
      # alors qu'AUCUN des paquets concernes n'etait dans une configuration
      # runtime -- verifie un par un via `gradlew :androidApp:dependencies`.
      # netty venait du runner de tests, bouncycastle de l'outillage de
      # signature. Rien de tout cela n'entre dans l'APK.
      #
      # Ces alertes n'etaient pas davantage corrigeables : monter AGP a la
      # derniere version (9.1.1 -> 9.3.1) laisse bouncycastle en 1.79.
      #
      # Filtrer vaut mieux que rejeter une a une : on ne masque rien, on cesse
      # simplement de declarer comme livre ce qui ne l'est pas -- et une vraie
      # vulnerabilite d'une dependance d'application restera visible.
      - uses: gradle/actions/dependency-submission@v6.2.0
        env:
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: ".*[Rr]untimeClasspath"
